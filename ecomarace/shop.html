<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Ecomarace</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="header__logo">eco<span>marace</span></a>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
      </ul>
    </nav>
    <div class="header__search">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search products…" id="search-input" autocomplete="off" />
    </div>
    <div class="header__actions">
      <div id="user-area"></div>
      <a href="cart.html" class="cart-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Cart
        <span id="cart-badge"></span>
      </a>
      <button class="nav-toggle" id="nav-toggle">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="page-banner">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> › <span id="page-title-bc">All Products</span></div>
    <h1 id="page-title-h">All Products</h1>
  </div>
</div>

<main>
  <div class="container shop-layout">
    <!-- Sidebar -->
    <aside class="shop-sidebar">
      <div class="sidebar-section">
        <h4>Categories</h4>
        <div id="cat-filters"></div>
      </div>
      <div class="sidebar-section">
        <h4>Price Range</h4>
        <div class="price-range">
          <input type="range" min="0" max="250" value="250" id="price-range" />
          <div class="price-display">Up to <strong id="price-label">$250</strong></div>
        </div>
      </div>
      <div class="sidebar-section">
        <h4>Rating</h4>
        <div id="rating-filters"></div>
      </div>
      <button class="btn btn--outline btn--full btn--sm" onclick="clearFilters()">Clear all filters</button>
    </aside>

    <!-- Main -->
    <div class="shop-main">
      <div class="shop-toolbar">
        <span class="shop-count" id="product-count">12 products</span>
        <select class="shop-sort" id="sort-select">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="reviews">Most Reviewed</option>
          <option value="newest">Newest</option>
        </select>
      </div>
      <div id="active-filters" class="active-filters"></div>
      <div class="products-grid" id="products-grid"></div>
      <div id="no-results" class="hidden" style="text-align:center;padding:4rem 0;">
        <div style="font-size:3rem;margin-bottom:1rem;">🔍</div>
        <h3>No products found</h3>
        <p>Try adjusting your filters or search query.</p>
        <button class="btn btn--outline" style="margin-top:1rem;" onclick="clearFilters()">Clear filters</button>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom" style="border-top:1px solid #1e293b;padding-top:1.5rem;">
      <span>&copy; 2026 Ecomarace, Inc.</span>
      <span>Privacy · Terms</span>
    </div>
  </div>
</footer>

<div id="toasts"></div>
<script src="js/app.js"></script>
<script>
  initHeader();

  const params = new URLSearchParams(location.search);
  let activeCategory = params.get('cat') || 'all';
  let activePriceMax = 250;
  let activeRating   = 0;
  let activeSearch   = params.get('q') || '';
  let activeSort     = 'featured';

  // Apply URL search to input
  if (activeSearch) document.getElementById('search-input').value = activeSearch;

  // Build category filters
  document.getElementById('cat-filters').innerHTML = CATEGORIES.map(c => `
    <label class="filter-option ${c.id === activeCategory ? 'active' : ''}">
      <input type="radio" name="cat" value="${c.id}" ${c.id === activeCategory ? 'checked' : ''} />
      ${c.icon} ${c.label}
    </label>`).join('');

  // Rating filters
  document.getElementById('rating-filters').innerHTML = [4,3,2,1].map(r => `
    <label class="filter-option">
      <input type="radio" name="rating" value="${r}" ${activeRating === r ? 'checked' : ''}/>
      ${'★'.repeat(r)}${'☆'.repeat(5-r)} &amp; up
    </label>`).join('');

  // Event listeners
  document.querySelectorAll('input[name="cat"]').forEach(el => {
    el.addEventListener('change', () => { activeCategory = el.value; render(); updateCatActive(); });
  });
  document.querySelectorAll('input[name="rating"]').forEach(el => {
    el.addEventListener('change', () => { activeRating = Number(el.value); render(); });
  });
  const priceRange = document.getElementById('price-range');
  priceRange.addEventListener('input', () => {
    activePriceMax = Number(priceRange.value);
    document.getElementById('price-label').textContent = fmt(activePriceMax);
    render();
  });
  document.getElementById('sort-select').addEventListener('change', e => { activeSort = e.target.value; render(); });
  document.getElementById('search-input').addEventListener('input', e => { activeSearch = e.target.value.toLowerCase(); render(); });

  function updateCatActive() {
    document.querySelectorAll('.filter-option').forEach(l => {
      const inp = l.querySelector('input[name="cat"]');
      if (inp) l.classList.toggle('active', inp.value === activeCategory);
    });
  }

  function getFiltered() {
    return PRODUCTS.filter(p => {
      if (activeCategory !== 'all' && p.category !== activeCategory) return false;
      if (p.price > activePriceMax) return false;
      if (activeRating > 0 && p.rating < activeRating) return false;
      if (activeSearch && !p.name.toLowerCase().includes(activeSearch) && !p.category.includes(activeSearch)) return false;
      return true;
    });
  }

  function getSorted(arr) {
    const s = [...arr];
    if (activeSort === 'price-asc')  return s.sort((a,b) => a.price - b.price);
    if (activeSort === 'price-desc') return s.sort((a,b) => b.price - a.price);
    if (activeSort === 'rating')     return s.sort((a,b) => b.rating - a.rating);
    if (activeSort === 'reviews')    return s.sort((a,b) => b.reviews - a.reviews);
    if (activeSort === 'newest')     return s.sort((a,b) => b.id - a.id);
    return s.sort((a,b) => b.reviews - a.reviews); // featured
  }

  function render() {
    const results = getSorted(getFiltered());
    const grid = document.getElementById('products-grid');
    const noRes = document.getElementById('no-results');
    document.getElementById('product-count').textContent = `${results.length} product${results.length !== 1 ? 's' : ''}`;
    if (results.length === 0) { grid.innerHTML = ''; noRes.classList.remove('hidden'); }
    else { noRes.classList.add('hidden'); grid.innerHTML = results.map(productCard).join(''); }

    // Active filter chips
    const chips = [];
    if (activeCategory !== 'all') chips.push(`<span class="filter-chip" onclick="clearCat()">${activeCategory} ×</span>`);
    if (activePriceMax < 250) chips.push(`<span class="filter-chip" onclick="clearPrice()">Under ${fmt(activePriceMax)} ×</span>`);
    if (activeRating > 0) chips.push(`<span class="filter-chip" onclick="clearRating()">${'★'.repeat(activeRating)} &amp; up ×</span>`);
    if (activeSearch) chips.push(`<span class="filter-chip" onclick="clearSearch()">"${activeSearch}" ×</span>`);
    document.getElementById('active-filters').innerHTML = chips.join('');

    // Page title
    const cat = CATEGORIES.find(c => c.id === activeCategory);
    const title = activeSearch ? `Results for "${activeSearch}"` : (cat && cat.id !== 'all' ? cat.label : 'All Products');
    document.getElementById('page-title-h').textContent  = title;
    document.getElementById('page-title-bc').textContent = title;
  }

  function clearCat()    { activeCategory = 'all'; document.querySelector('input[name="cat"][value="all"]').checked = true; updateCatActive(); render(); }
  function clearPrice()  { activePriceMax = 250; priceRange.value = 250; document.getElementById('price-label').textContent = '$250'; render(); }
  function clearRating() { activeRating = 0; document.querySelectorAll('input[name="rating"]').forEach(i => i.checked = false); render(); }
  function clearSearch() { activeSearch = ''; document.getElementById('search-input').value = ''; render(); }
  function clearFilters(){ clearCat(); clearPrice(); clearRating(); clearSearch(); }

  render();
</script>
</body>
</html>
