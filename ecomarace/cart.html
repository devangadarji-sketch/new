<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Ecomarace</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="header__logo">eco<span>marace</span></a>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
    </nav>
    <div class="header__actions">
      <div id="user-area"></div>
      <a href="cart.html" class="cart-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Cart
        <span id="cart-badge"></span>
      </a>
      <button class="nav-toggle" id="nav-toggle">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="page-banner">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> › Shopping Cart</div>
    <h1>Shopping Cart</h1>
  </div>
</div>

<main>
  <div class="container cart-layout" id="cart-content"></div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom" style="border-top:1px solid #1e293b;padding-top:1.5rem;">
      <span>&copy; 2026 Ecomarace, Inc.</span>
      <a href="shop.html" style="color:#94a3b8;">← Continue shopping</a>
    </div>
  </div>
</footer>

<div id="toasts"></div>
<script src="js/app.js"></script>
<script>
  initHeader();

  let couponApplied = false;
  let discount = 0;

  function render() {
    const items = Cart.get();
    const container = document.getElementById('cart-content');

    if (items.length === 0) {
      container.innerHTML = `
        <div class="cart-empty" style="grid-column:1/-1;">
          <div class="cart-empty__icon">🛒</div>
          <h2>Your cart is empty</h2>
          <p>Looks like you haven't added anything yet.</p>
          <a href="shop.html" class="btn btn--primary btn--lg">Browse Products</a>
        </div>`;
      return;
    }

    const subtotal = Cart.subtotal();
    const shipping = subtotal >= 50 ? 0 : 5.99;
    const tax      = (subtotal - discount) * 0.08;
    const total    = subtotal - discount + shipping + tax;

    container.innerHTML = `
      <div>
        <div class="cart-table">
          <div class="cart-header">
            <span>Product</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Total</span>
            <span></span>
          </div>
          ${items.map(item => `
            <div class="cart-row" data-key="${item.key}">
              <div class="cart-product">
                <div class="cart-product__img" style="background:${item.product.bg}">${item.product.icon}</div>
                <div>
                  <div class="cart-product__name">${item.product.name}</div>
                  <div class="cart-product__var">
                    ${item.variant.color ? `Color: ${item.variant.color}` : ''}
                    ${item.variant.size  ? ` · Size: ${item.variant.size}` : ''}
                  </div>
                </div>
              </div>
              <div class="cart-price">${fmt(item.product.price)}</div>
              <div class="cart-qty">
                <button onclick="changeQty('${item.key}', ${item.qty - 1})">−</button>
                <input type="number" min="1" max="99" value="${item.qty}" onchange="changeQty('${item.key}', parseInt(this.value)||1)" />
                <button onclick="changeQty('${item.key}', ${item.qty + 1})">+</button>
              </div>
              <div class="cart-total">${fmt(item.product.price * item.qty)}</div>
              <button class="cart-remove" onclick="removeItem('${item.key}')" title="Remove">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
              </button>
            </div>`).join('')}
          <div class="coupon-row">
            <input type="text" class="input" id="coupon-input" placeholder="Coupon code (try ECO20)" style="max-width:260px;" />
            <button class="btn btn--outline" onclick="applyCoupon()">Apply</button>
            ${couponApplied ? '<span style="color:var(--green);font-weight:600;align-self:center;">✓ ECO20 applied — 20% off!</span>' : ''}
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        ${items.map(i => `
          <div class="summary-item">
            <div class="summary-item__img" style="background:${i.product.bg}">${i.product.icon}</div>
            <div class="summary-item__info">
              <div class="summary-item__name">${i.product.name}</div>
              <div class="summary-item__var">Qty: ${i.qty}</div>
            </div>
            <div class="summary-item__price">${fmt(i.product.price * i.qty)}</div>
          </div>`).join('')}
        <div class="summary-totals">
          <div class="summary-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
          ${discount > 0 ? `<div class="summary-row" style="color:var(--green)"><span>Discount (20%)</span><span>−${fmt(discount)}</span></div>` : ''}
          <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--green)">Free</span>' : fmt(shipping)}</span></div>
          <div class="summary-row"><span>Tax (8%)</span><span>${fmt(tax)}</span></div>
          <div class="summary-row summary-row--total"><span>Total</span><span>${fmt(total)}</span></div>
        </div>
        ${shipping > 0 ? `<div style="font-size:.8rem;color:var(--green);margin:.75rem 0;padding:.6rem;background:#f0fdf4;border-radius:8px;text-align:center;">Add ${fmt(50 - subtotal)} more for <strong>free shipping!</strong></div>` : ''}
        <a href="checkout.html" class="btn btn--primary btn--full" style="margin-top:1rem;">
          Proceed to Checkout
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="shop.html" class="btn btn--ghost btn--full" style="margin-top:.5rem;">Continue Shopping</a>
        <div style="display:flex;justify-content:center;gap:.75rem;margin-top:1.25rem;font-size:.75rem;color:var(--text3);align-items:center;">
          <span>🔒 Secure</span><span>·</span><span>256-bit SSL</span><span>·</span><span>PCI DSS</span>
        </div>
      </div>`;
  }

  function changeQty(key, qty) {
    if (qty < 1) { removeItem(key); return; }
    Cart.updateQty(key, qty);
    render();
  }

  function removeItem(key) {
    Cart.remove(key);
    showToast('Item removed from cart', 'info');
    render();
  }

  function applyCoupon() {
    const val = document.getElementById('coupon-input')?.value.trim().toUpperCase();
    if (val === 'ECO20' && !couponApplied) {
      couponApplied = true;
      discount = Cart.subtotal() * 0.20;
      showToast('Coupon applied! 20% off your order 🎉');
      render();
    } else if (couponApplied) {
      showToast('Coupon already applied.', 'info');
    } else {
      showToast('Invalid coupon code.', 'error');
    }
  }

  render();
</script>
</body>
</html>
